name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Annule l'exécution précédente si un nouveau push arrive sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (Java 25 / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Génère les interfaces depuis api/openapi.yaml, compile,
      # puis lance les tests (Testcontainers démarre Oracle via Docker)
      - name: Build et tests
        run: mvn -B verify

  frontend:
    name: Front-end (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client API depuis le contrat
        run: npm run generate:api

      - name: Tests
        run: npx ng test --watch=false

      - name: Build de production
        run: npm run build