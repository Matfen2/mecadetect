name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Une nouvelle poussÃ©e annule l'exÃ©cution en cours sur la mÃªme branche,
# sauf sur main : un dÃ©ploiement commencÃ© va toujours Ã  son terme
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Droits minimaux par dÃ©faut ; chaque job Ã©largit seulement ce dont il a besoin
permissions:
  contents: read

env:
  IMAGES: ghcr.io/matfen2/mecadetect

jobs:
  backend:
    name: Back-end (Java 25 / Spring Boot)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: RÃ©cupÃ©rer le code
        uses: actions/checkout@v5

      - name: Installer Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # GÃ©nÃ¨re les interfaces depuis api/openapi.yaml, compile,
      # puis lance les tests (Testcontainers dÃ©marre Oracle via Docker)
      # GÃ©nÃ¨re aussi le rapport de couverture JaCoCo (target/site/jacoco)
      - name: Build et tests
        run: mvn -B verify

      # Classes compilÃ©es et couverture, reprises par le job SonarCloud
      - name: Conserver les rÃ©sultats pour l'analyse
        uses: actions/upload-artifact@v6
        with:
          name: analyse-backend
          path: |
            backend/target/classes
            backend/target/test-classes
            backend/target/site/jacoco/jacoco.xml
          retention-days: 1

  frontend:
    name: Front-end (Angular)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: RÃ©cupÃ©rer le code
        uses: actions/checkout@v5

      # MÃªme version que l'image de production (node:24)
      - name: Installer Node 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dÃ©pendances
        run: npm ci

      # Le gÃ©nÃ©rateur tÃ©lÃ©charge son jar Ã  chaque exÃ©cution : on le garde en cache
      # (aprÃ¨s npm ci, qui vide node_modules)
      - name: Cache du jar openapi-generator
        uses: actions/cache@v5
        with:
          path: frontend/node_modules/@openapitools/openapi-generator-cli/versions
          key: openapi-generator-cli-${{ hashFiles('frontend/openapitools.json') }}

      - name: GÃ©nÃ©rer le client API depuis le contrat
        run: npm run generate:api

      - name: Tests et couverture
        run: npx ng test --watch=false --coverage --coverage-reporters=lcov --coverage-reporters=text-summary

      - name: Conserver la couverture pour l'analyse
        uses: actions/upload-artifact@v6
        with:
          name: couverture-frontend
          path: frontend/coverage
          retention-days: 1

      - name: Build de production
        run: npm run build

  # ---------------------------------------------------------------- QualitÃ©
  # IndÃ©pendant de la livraison : une alerte de qualitÃ© se traite,
  # elle ne bloque pas un correctif urgent
  qualite:
    name: QualitÃ© (SonarCloud)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      # Historique complet : SonarCloud distingue le code nouveau de l'ancien
      - name: RÃ©cupÃ©rer le code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: RÃ©sultats du back-end
        uses: actions/download-artifact@v6
        with:
          name: analyse-backend
          path: backend/target

      - name: Couverture du front-end
        uses: actions/download-artifact@v6
        with:
          name: couverture-frontend
          path: frontend/coverage

      - name: Analyse SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------- Livraison
  # AprÃ¨s un merge sur main, ou Ã  la demande (bouton Â« Run workflow Â»),
  # et seulement si les tests sont verts
  images:
    name: Image ${{ matrix.composant }} (arm64, GHCR)
    needs: [backend, frontend]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      # Une image en Ã©chec n'annule pas l'autre : on voit les deux rÃ©sultats
      fail-fast: false
      matrix:
        include:
          - composant: api
            dockerfile: backend/Dockerfile
          - composant: front
            dockerfile: frontend/Dockerfile
    steps:
      - name: RÃ©cupÃ©rer le code
        uses: actions/checkout@v5

      # Ã‰mulation arm64 : seules les Ã©tapes finales des images en ont besoin,
      # Maven et npm tournent en natif ($BUILDPLATFORM dans les Dockerfiles)
      - name: Ã‰mulation arm64
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGES }}-${{ matrix.composant }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.composant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.composant }}

      # Bloque la publication si l'image contient une faille critique ou haute
      # qui a un correctif. Version 0.35.0 : publication immuable, postÃ©rieure
      # Ã  la compromission des Ã©tiquettes de trivy-action (CVE-2026-33634).
      - name: Analyse de vulnÃ©rabilitÃ©s (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGES }}-${{ matrix.composant }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Connexion Ã  GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ã‰tiquette du commit (immuable, sert aux retours arriÃ¨re) et latest
      - name: Publier
        run: |
          image="$IMAGES-${{ matrix.composant }}"
          docker push "$image:$GITHUB_SHA"
          docker tag "$image:$GITHUB_SHA" "$image:latest"
          docker push "$image:latest"

  deploiement:
    name: DÃ©ploiement (Oracle Cloud)
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.DOMAINE }}
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    steps:
      - name: RÃ©cupÃ©rer le code
        uses: actions/checkout@v5

      # ClÃ© dÃ©diÃ©e au dÃ©ploiement, et empreinte du serveur Ã©pinglÃ©e :
      # pas de StrictHostKeyChecking=no, qui accepterait n'importe quel serveur
      - name: PrÃ©parer SSH
        env:
          CLE: ${{ secrets.SSH_CLE_DEPLOIEMENT }}
          HOTE_CONNU: ${{ secrets.SSH_HOTE_CONNU }}
          HOTE: ${{ vars.SSH_HOTE }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          printf '%s\n' "$HOTE_CONNU" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host production
              HostName $HOTE
              User ubuntu
              IdentityFile ~/.ssh/deploiement
              IdentitiesOnly yes
              BatchMode yes
          CONF

      - name: Copier la configuration
        run: |
          scp compose.prod.yaml deploiement/reinitialiser-demo.sh production:/opt/mecadetect/
          scp deploiement/Caddyfile production:/opt/mecadetect/deploiement/

      # Le jeton GitHub, valable le temps du job, passe par l'entrÃ©e standard :
      # il n'apparaÃ®t ni dans les arguments ni dans les journaux
      - name: Connexion de la VM Ã  GHCR
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$JETON" | ssh production \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: DÃ©ployer la version ${{ github.sha }}
        run: |
          ssh production bash -s -- "$GITHUB_SHA" <<'SCRIPT'
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          cd /opt/mecadetect
          compose() { docker compose -f compose.prod.yaml --env-file .env.prod "$@"; }

          # Version dÃ©ployÃ©e = commit : un retour arriÃ¨re remet simplement l'ancienne valeur
          if grep -q '^VERSION=' .env.prod; then
              sed -i "s/^VERSION=.*/VERSION=$1/" .env.prod
          else
              echo "VERSION=$1" >> .env.prod
          fi
          chmod +x reinitialiser-demo.sh

          compose pull --quiet api front
          compose up -d --no-build --wait --wait-timeout 600
          # Le Caddyfile est montÃ© depuis l'hÃ´te : Caddy le relit sans couper le service
          compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          # Images inutilisÃ©es de plus de 7 jours : on garde de quoi revenir en arriÃ¨re
          docker image prune -af --filter "until=168h"
          compose ps
          SCRIPT

      # Les 15 vÃ©rifications de production, depuis Internet
      - name: VÃ©rifier le site en production
        run: pwsh scripts/verifier-production.ps1 -Domaine "${{ vars.DOMAINE }}"
