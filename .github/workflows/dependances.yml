name: Dépendances

# Les bases de vulnérabilités évoluent même quand le code ne bouge pas :
# contrôle chaque semaine, et à chaque modification des dépendances
on:
  schedule:
    - cron: '17 4 * * 1' # lundi, vers 6 h à Paris
  push:
    branches: [main, develop]
    paths:
      - backend/pom.xml
      - backend/dependency-check-suppressions.xml
      - frontend/package-lock.json
      - .github/workflows/dependances.yml
  pull_request:
    branches: [main, develop]
    paths:
      - backend/pom.xml
      - backend/dependency-check-suppressions.xml
      - frontend/package-lock.json
      - .github/workflows/dependances.yml
  workflow_dispatch:

# Pas d'annulation : la première mise à jour de la base NVD dure des heures,
# l'interrompre ferait tout recommencer
concurrency:
  group: dependances-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Back-end (OWASP Dependency-Check)
    runs-on: ubuntu-24.04
    timeout-minutes: 350 # maximum GitHub : 360
    permissions:
      contents: read
      security-events: write # résultats publiés dans l'onglet Security
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Base NVD locale (plus de 400 000 vulnérabilités, plusieurs centaines de Mo).
      # Le premier téléchargement prend environ 3 heures (débit limité par la NVD) ;
      # les suivants ne récupèrent que les nouveautés, en une ou deux minutes.
      - name: Restaurer la base NVD
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nvd-

      # Étape séparée, avec sa propre limite de temps : si elle échoue ou dépasse,
      # la base est quand même enregistrée à l'étape suivante
      - name: Mettre à jour la base NVD
        timeout-minutes: 300
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B dependency-check:update-only

      # Toujours enregistrée, y compris après un échec : rien n'est retéléchargé deux fois
      - name: Enregistrer la base NVD
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Analyse des dépendances
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B dependency-check:check

      # Même en cas d'échec : c'est là qu'on lit le détail des failles
      - name: Rapport HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: rapport-dependency-check
          path: backend/target/dependency-check-report.html
          retention-days: 30

      # Les pull requests venant d'un fork n'ont pas le droit d'écrire
      - name: Publier dans l'onglet Security
        if: ${{ !cancelled() && hashFiles('backend/target/dependency-check-report.sarif') != '' && github.event.pull_request.head.repo.fork != true }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: backend/target/dependency-check-report.sarif
          category: dependency-check

  frontend:
    name: Front-end (npm audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # npm audit lit package-lock.json : pas besoin d'installer les paquets.
      # Bloquant pour ce qui part en production (le code livré au navigateur)
      - name: Dépendances de production
        run: npm audit --omit=dev --audit-level=high

      # Outillage de build et de test : signalé, non bloquant
      - name: Dépendances de développement (information)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --audit-level=high