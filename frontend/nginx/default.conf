# Nginx du conteneur front : sert l'application Angular construite.
# Les en-têtes de sécurité et HTTPS sont posés par le proxy d'entrée (Caddy).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/mecadetect;

    # « Server: nginx », sans numéro de version
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Sonde de santé du conteneur (healthcheck de Docker Compose)
    location = /sante {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # L'API n'est pas servie par ce conteneur : une 404 nette plutôt que la page
    # Angular, qui masquerait une erreur de routage du proxy.
    location /api/ {
        return 404;
    }

    # Fichiers dont le nom porte une empreinte (main-2KJQZ3XE.js, styles-….css,
    # media/…) : leur contenu ne change jamais, le navigateur les garde un an.
    # Un fichier absent donne une 404, pas index.html.
    location ~* "-[a-z0-9]{8}\.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html est toujours revalidé : un déploiement est vu au rechargement suivant
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Routes Angular (/interventions/42…) : index.html, le routeur fait le reste
    location / {
        try_files $uri /index.html;
    }
}
