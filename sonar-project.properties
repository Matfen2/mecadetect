# Analyse SonarQube Cloud de MecaDetect (back Java et front Angular dans un meme projet)
sonar.organization=matfen2
sonar.projectKey=Matfen2_mecadetect
sonar.projectName=M\u00e9caD\u00e9tect
sonar.sourceEncoding=UTF-8

# Code de l'application et code des tests
sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=frontend/src/**/*.spec.ts
# Client API genere depuis le contrat : ce n'est pas notre code
sonar.exclusions=frontend/src/**/*.spec.ts,frontend/src/app/core/api/**

# Java : classes compilees et couverture JaCoCo
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# TypeScript : couverture Vitest au format lcov
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

# Fichiers sans logique testable : configuration et point d'entree
sonar.coverage.exclusions=frontend/src/main.ts,frontend/src/app/app.config.ts,frontend/src/app/app.routes.ts,backend/src/main/java/**/*Application.java